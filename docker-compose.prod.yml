version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: telephony-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - admin-web

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: telephony-prod-api
    restart: always
    env_file:
      - .env.production
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: telephony-prod-worker
    restart: always
    env_file:
      - .env.production

  admin-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    container_name: telephony-prod-admin-web
    restart: always
    env_file:
      - .env.production
    expose:
      - "3000"
