version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: telephony-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: calling_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-pcrm_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: telephony-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: telephony-minio-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_key_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: telephony-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - DATABASE_URL=mysql+pymysql://crm_user:crm_dev_password@mysql:3306/calling_crm
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev_super_secret_jwt_key_for_local_testing_only_12345
      - AWS_S3_BUCKET=telephony-local-recordings
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio_admin
      - AWS_SECRET_ACCESS_KEY=minio_secret_key_123
      - AWS_REGION=ap-south-1
      - ADMIN_WEB_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: telephony-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - DATABASE_URL=mysql+pymysql://crm_user:crm_dev_password@mysql:3306/calling_crm
      - REDIS_URL=redis://redis:6379/0
      - AWS_S3_BUCKET=telephony-local-recordings
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio_admin
      - AWS_SECRET_ACCESS_KEY=minio_secret_key_123
      - AWS_REGION=ap-south-1
    volumes:
      - ./backend:/app/backend

  admin-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    container_name: telephony-admin-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
